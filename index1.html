<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My First Web AR</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            z-index: 10;
            border-radius: 8px;
        }

        #arButton {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            padding: 15px 25px;

            font-size: 18px;

            border: none;
            border-radius: 8px;

            background: #ffffff;
            color: #000000;

            z-index: 20;
        }

    </style>

</head>


<body>

    <div id="info">
        My First AR Application
    </div>


    <!-- Three.js -->

    <script type="module">

        import * as THREE
        from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


        // ------------------------------------------------
        // 1. CREATE SCENE
        // ------------------------------------------------

        const scene = new THREE.Scene();


        // ------------------------------------------------
        // 2. CREATE CAMERA
        // ------------------------------------------------

        const camera =
            new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.01,
                20
            );


        // ------------------------------------------------
        // 3. CREATE RENDERER
        // ------------------------------------------------

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });


        renderer.setPixelRatio(
            window.devicePixelRatio
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.xr.enabled = true;


        document.body.appendChild(
            renderer.domElement
        );


        // ------------------------------------------------
        // 4. LIGHT
        // ------------------------------------------------

        const light =
            new THREE.HemisphereLight(
                0xffffff,
                0xbbbbff,
                3
            );


        scene.add(light);


        // ------------------------------------------------
        // 5. CREATE CUBE
        // ------------------------------------------------

        const geometry =
            new THREE.BoxGeometry(
                0.2,
                0.2,
                0.2
            );


        const material =
            new THREE.MeshNormalMaterial();


        const cube =
            new THREE.Mesh(
                geometry,
                material
            );


        // Initially hide cube
        cube.visible = false;


        scene.add(cube);


        // ------------------------------------------------
        // 6. CREATE RETICLE
        // ------------------------------------------------

        const reticle =
            new THREE.Mesh(

                new THREE.RingGeometry(
                    0.08,
                    0.1,
                    32
                ),

                new THREE.MeshBasicMaterial()
            );


        reticle.rotation.x =
            -Math.PI / 2;


        reticle.matrixAutoUpdate = false;

        reticle.visible = false;


        scene.add(reticle);


        // ------------------------------------------------
        // 7. VARIABLES
        // ------------------------------------------------

        let hitTestSource = null;

        let hitTestSourceRequested = false;


        // ------------------------------------------------
        // 8. START AR
        // ------------------------------------------------

        async function startAR() {

            if (!navigator.xr) {

                alert(
                    "WebXR is not available on this device/browser."
                );

                return;
            }


            const supported =
                await navigator.xr.isSessionSupported(
                    "immersive-ar"
                );


            if (!supported) {

                alert(
                    "Immersive AR is not supported on this device."
                );

                return;
            }


            const session =
                await navigator.xr.requestSession(
                    "immersive-ar",
                    {
                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root: document.body
                        }
                    }
                );


            renderer.xr.setReferenceSpaceType(
                "local"
            );


            await renderer.xr.setSession(
                session
            );

        }


        // ------------------------------------------------
        // 9. CREATE AR BUTTON
        // ------------------------------------------------

        const arButton =
            document.createElement("button");


        arButton.id = "arButton";

        arButton.innerText =
            "START AR";


        document.body.appendChild(
            arButton
        );


        arButton.addEventListener(
            "click",
            startAR
        );


        // ------------------------------------------------
        // 10. AR CONTROLLER
        // ------------------------------------------------

        const controller =
            renderer.xr.getController(0);


        controller.addEventListener(
            "select",
            function() {

                if (reticle.visible) {

                    cube.position.setFromMatrixPosition(
                        reticle.matrix
                    );

                    cube.visible = true;

                }

            }
        );


        scene.add(controller);


        // ------------------------------------------------
        // 11. ANIMATION LOOP
        // ------------------------------------------------

        renderer.setAnimationLoop(

            function(
                timestamp,
                frame
            ) {

                if (frame) {

                    const referenceSpace =
                        renderer.xr.getReferenceSpace();


                    const session =
                        renderer.xr.getSession();


                    if (!hitTestSourceRequested) {

                        session
                            .requestReferenceSpace(
                                "viewer"
                            )
                            .then(
                                function(
                                    referenceSpace
                                ) {

                                    session
                                        .requestHitTestSource({
                                            space:
                                                referenceSpace
                                        })
                                        .then(
                                            function(
                                                source
                                            ) {

                                                hitTestSource =
                                                    source;

                                            }
                                        );

                                }
                            );


                        session.addEventListener(
                            "end",
                            function() {

                                hitTestSourceRequested =
                                    false;

                                hitTestSource =
                                    null;

                                reticle.visible =
                                    false;

                                cube.visible =
                                    false;

                            }
                        );


                        hitTestSourceRequested =
                            true;

                    }


                    if (hitTestSource) {

                        const hitTestResults =
                            frame.getHitTestResults(
                                hitTestSource
                            );


                        if (
                            hitTestResults.length > 0
                        ) {

                            const hit =
                                hitTestResults[0];


                            const pose =
                                hit.getPose(
                                    referenceSpace
                                );


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );

                        }

                        else {

                            reticle.visible =
                                false;

                        }

                    }

                }


                // Rotate cube
                if (cube.visible) {

                    cube.rotation.y += 0.01;

                    cube.rotation.x += 0.005;

                }


                renderer.render(
                    scene,
                    camera
                );

            }

        );


        // ------------------------------------------------
        // 12. WINDOW RESIZE
        // ------------------------------------------------

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>

</html>
